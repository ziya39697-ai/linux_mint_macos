<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    macOS Control Center menu bar glyph, traced from Apple's own image
    (support.apple.com "the Control Center status menu", 52x60 @2x):
      top    = OFF switch: outline pill, solid knob at the LEFT cap centre
      bottom = ON  switch: solid pill, knob knocked out at the RIGHT cap centre
    The glyph is taller than wide (w/h ~0.82).  Pills 12.5 x 6, gap 1.7,
    wall 0.9 (outer r 3, inner r 2.1), knob r 1.45 / hole r 1.6 - the knob keeps
    0.65 px clearance to the inner wall so it stays a circle at 16 px.

    Filled <path>/<circle> only, never stroked: GTK's symbolic loader injects
    `rect, circle, path { fill: <fg> !important; }` and ignores `stroke`.
  -->
  <path fill-rule="evenodd" fill="#2e3436"
        d="M 4.75 1.15 H 11.25 A 3 3 0 0 1 11.25 7.15 H 4.75 A 3 3 0 0 1 4.75 1.15 Z
           M 4.75 2.05 H 11.25 A 2.1 2.1 0 0 1 11.25 6.25 H 4.75 A 2.1 2.1 0 0 1 4.75 2.05 Z"/>
  <circle cx="4.75" cy="4.15" r="1.45" fill="#2e3436"/>

  <path fill-rule="evenodd" fill="#2e3436"
        d="M 4.75 8.85 H 11.25 A 3 3 0 0 1 11.25 14.85 H 4.75 A 3 3 0 0 1 4.75 8.85 Z
           M 12.85 11.85 A 1.6 1.6 0 1 0 9.65 11.85 A 1.6 1.6 0 1 0 12.85 11.85 Z"/>
</svg>
