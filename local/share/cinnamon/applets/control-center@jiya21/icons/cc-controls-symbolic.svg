<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    macOS Control Center glyph: two capsule outlines with round knobs inside,
    top knob right of centre, bottom knob left.

    Filled <path>/<circle> only, never stroked. GTK's symbolic loader injects
    `rect, circle, path { fill: <fg> !important; }` and does not touch `stroke`
    or elements like <line>/<polygon>, so anything stroked would keep the
    literal colour below and go invisible on a dark panel.

    The comment sits INSIDE <svg>: gdk-pixbuf sniffs the file type from the
    first bytes, and a long leading comment makes it fail to recognise the file
    as SVG at all.
  -->
  <path fill-rule="evenodd" fill="#2e3436"
        d="M 3.25 1.5 H 12.75 A 2.75 2.75 0 0 1 12.75 7 H 3.25 A 2.75 2.75 0 0 1 3.25 1.5 Z
           M 3.25 2.6 H 12.75 A 1.65 1.65 0 0 1 12.75 5.9 H 3.25 A 1.65 1.65 0 0 1 3.25 2.6 Z"/>
  <circle cx="10.1" cy="4.25" r="1.3" fill="#2e3436"/>

  <path fill-rule="evenodd" fill="#2e3436"
        d="M 3.25 9 H 12.75 A 2.75 2.75 0 0 1 12.75 14.5 H 3.25 A 2.75 2.75 0 0 1 3.25 9 Z
           M 3.25 10.1 H 12.75 A 1.65 1.65 0 0 1 12.75 13.4 H 3.25 A 1.65 1.65 0 0 1 3.25 10.1 Z"/>
  <circle cx="5.9" cy="11.75" r="1.3" fill="#2e3436"/>
</svg>
