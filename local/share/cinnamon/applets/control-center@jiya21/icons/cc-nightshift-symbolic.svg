<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- macOS Night Shift: a sun whose disc is half filled, eight short rays.
       Disc r 4.3 with a 1.1 ring so the half-fill still reads at 22 px.
       Filled paths only; rays are thin rounded rectangles. -->
  <path fill-rule="evenodd" fill="#2e3436"
        d="M 8 3.7 A 4.3 4.3 0 1 0 8 12.3 A 4.3 4.3 0 1 0 8 3.7 Z
           M 8 4.8 A 3.2 3.2 0 1 1 8 11.2 A 3.2 3.2 0 1 1 8 4.8 Z"/>
  <path fill="#2e3436" d="M 8 4.8 A 3.2 3.2 0 0 0 8 11.2 Z"/>
  <g fill="#2e3436">
    <rect x="7.4" y="0.4" width="1.2" height="2.2" rx="0.6"/>
    <rect x="7.4" y="13.4" width="1.2" height="2.2" rx="0.6"/>
    <rect x="0.4" y="7.4" width="2.2" height="1.2" rx="0.6"/>
    <rect x="13.4" y="7.4" width="2.2" height="1.2" rx="0.6"/>
    <rect x="7.4" y="0.4" width="1.2" height="2.2" rx="0.6" transform="rotate(45 8 8)"/>
    <rect x="7.4" y="13.4" width="1.2" height="2.2" rx="0.6" transform="rotate(45 8 8)"/>
    <rect x="0.4" y="7.4" width="2.2" height="1.2" rx="0.6" transform="rotate(45 8 8)"/>
    <rect x="13.4" y="7.4" width="2.2" height="1.2" rx="0.6" transform="rotate(45 8 8)"/>
  </g>
</svg>
